groups:
  - name: logitrack-alerts
    rules:
      - alert: ApiDown
        expr: up{job="logitrack"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API LogiTrack is offline"
          description: "The LogiTrack application has been down for more than 1 minute."

      - alert: HttpHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.*"}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "HTTP 5xx error rate is above 5% (current value: {{ $value }}%) for more than 2 minutes."

      - alert: HttpSlowResponseTime
        expr: sum(rate(http_server_requests_seconds_sum[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time detected"
          description: "Average response time is above 1.5s (current value: {{ $value }}s) for more than 2 minutes."

      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High JVM memory usage"
          description: "JVM Heap memory usage is above 85% (current value: {{ $value }}%) for more than 2 minutes."
